# Render Blueprint — deploys the whole app as a single Node service.
#
# After first deploy:
#   1. Add PUBLIC_APP_URL env var = your service URL, e.g. https://verisync.onrender.com
#   2. (Optional) CORS_ORIGIN = same URL
#   3. Redeploy / restart so QR codes use the public URL.

databases:
  - name: verisync-postgres
    plan: free

services:
  - type: web
    name: verisync
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/Sanskarsanshu/verisyncv3
    branch: main
    healthCheckPath: /health
    buildCommand: npm run install:all && npm run download:model && npm run build
    startCommand: cd backend && npx prisma db push && npx prisma db seed && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: REGISTRATION_TOKEN_EXPIRES_IN
        value: 30m
      - key: FACE_SIMILARITY_THRESHOLD
        value: 0.45
      - key: DATABASE_URL
        fromDatabase:
          name: verisync-postgres
          property: connectionString
